sentence=Comprehensive CAN bus library for ESP32 using built-in TWAI driver
paragraph=A powerful and easy-to-use CAN bus library for ESP32 microcontrollers that leverages the built-in TWAI (Two-Wire Automotive Interface) driver. Features include multiple CAN speeds (125k-1M bps), advanced message filtering (single ID, multiple ID, range, custom mask), non-blocking operations with callbacks, comprehensive error handling, and support for both standard and extended CAN frames. Compatible with all ESP32 variants including ESP32, ESP32-S2, ESP32-S3, and ESP32-C3.
